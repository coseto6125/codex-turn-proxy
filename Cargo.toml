[package]
name = "codex-turn-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
blake3 = "1"
libc = "0.2"
shlex = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[profile.release]
lto = "thin"
strip = true
