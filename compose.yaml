services:
  proxy:
    image: codex-turn-proxy:local
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${PROXY_PORT:-8787}:8787"
    environment:
      PROXY_TOKEN: ${PROXY_TOKEN:?Set a random PROXY_TOKEN of at least 32 characters}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-https://api.openai.com/v1}
      OUTPUT_STORE_DIR: /tool-results
      MAX_STORE_BYTES: ${MAX_STORE_BYTES:-268435456}
      MAX_STORE_ENTRIES: ${MAX_STORE_ENTRIES:-8192}
      STORE_IDLE_SECONDS: ${STORE_IDLE_SECONDS:-900}
    volumes:
      - type: bind
        source: ${OUTPUT_STORE_DIR:-${HOME}/.local/state/codex-turn-proxy/tool-results}
        target: /tool-results
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 1g
    restart: unless-stopped
